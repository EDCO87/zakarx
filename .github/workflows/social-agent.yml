name: 📱 Social Media Agent

on:
  schedule:
    # Cada 4 días a las 10am Colombia (15:00 UTC)
    - cron: '0 15 */4 * *'
  workflow_dispatch:

jobs:
  generate-social-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Social Agent
        run: python agents/social_agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit & Push social posts
        run: |
          git config user.name "ZAKARX Bot 🤖"
          git config user.email "corrales.elias@gmail.com"
          git add social-posts.md
          git diff --staged --quiet || git commit -m "📱 Posts redes sociales generados $(date +'%d/%m/%Y')"
          git push
