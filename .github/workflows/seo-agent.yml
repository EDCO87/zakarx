name: 🔍 SEO Agent

on:
  schedule:
    # Todos los miércoles a las 10am Colombia (15:00 UTC)
    - cron: '0 15 * * 3'
  workflow_dispatch:

jobs:
  optimize-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SEO Agent
        run: python agents/seo_agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: agents

      - name: Commit & Push changes
        run: |
          git config user.name "ZAKARX Bot 🤖"
          git config user.email "corrales.elias@gmail.com"
          git add index.html reporte-seo.md
          git diff --staged --quiet || git commit -m "🔍 SEO meta tags optimizados $(date +'%d/%m/%Y')"
          git push
