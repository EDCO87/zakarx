name: 👔 CEO Agent (Reporte Semanal)

on:
  schedule:
    # Todos los lunes a las 9am Colombia (UTC-5 = 14:00 UTC)
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  ceo-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CEO Agent
        run: python agents/ceo_agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit & Push report
        run: |
          git config user.name "ZAKARX Bot 🤖"
          git config user.email "corrales.elias@gmail.com"
          git add reporte-semanal.md
          git diff --staged --quiet || git commit -m "👔 Reporte semanal $(date +'%d/%m/%Y')"
          git push
