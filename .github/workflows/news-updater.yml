name: 📰 News Updater

on:
  schedule:
    # Cada 4 días a las 9am Colombia (UTC-5 = 14:00 UTC)
    - cron: '0 14 */4 * *'
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run News Updater
        run: python agents/news_updater.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit & Push changes
        run: |
          git config user.name "ZAKARX Bot 🤖"
          git config user.email "corrales.elias@gmail.com"
          git add index.html
          git diff --staged --quiet || git commit -m "📰 Noticias actualizadas automáticamente $(date +'%d/%m/%Y')"
          git push
